<div class="card rounded-5 overflow-hidden h-100 card-container">
    <img class="card-img-top h-75" [src]="step().img" [style.background-color]="step().bgcolor">
    <div class="card-body d-flex flex-column">
        <h3 class="card-title">{{step().title}}</h3>
        <p class="card-text">{{step().description}}</p>
        <nav class="row justify-content-center p-0 mt-auto">
            <div class="col-2 d-flex justify-content-around align-self-center p-0">
                <button class="btn bi bi-arrow-left-circle fs-1" [hidden]="currentStep()==0" (click)="changeStep(currentStep() - 1)"></button>
            </div>
            <div class="col-8 d-flex justify-content-around align-self-center p-0">
                @for (stepelement of steps(); track $index) {
                    @if($index == currentStep()){
                        <button class="btn bi bi-circle-fill fs-6 p-0"></button>
                    } @else {
                        <button class="btn bi bi-circle fs-6 p-0" (click)="changeStep($index)"></button>
                    }
                }
            </div>
            <div class="col-2 d-flex justify-content-around align-self-center p-0">
                <button class="btn bi bi-arrow-right-circle-fill fs-1" [hidden]="currentStep()==steps().length-1" (click)="changeStep(currentStep() + 1)"></button>
            </div>
        </nav>
    </div>
</div>
