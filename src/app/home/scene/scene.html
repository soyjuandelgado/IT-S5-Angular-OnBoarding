<div class="h-100">

    <div class="card rounded-5 overflow-hidden h-100" >
        <img class="card-img-top h-75" src="./{{step().img}}" [style.background-color]="step().bgcolor" >
        <div class="card-body">
            <h3 class="card-title">{{step().title}}</h3>
            <p class="card-text">{{step().description}}</p>
            <footer class="d-flex justify-content-between align-items-center">
                <a href="" class="btn bi bi-arrow-left-circle fs-1"></a><a href="" class="btn bi bi-circle-fill"></a><a href="" class="btn bi bi-circle"></a><a href="" class="btn bi bi-arrow-right-circle-fill fs-1"></a>
            </footer>
    </div>
</div>
</div>
